name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dependency boundaries
        run: npm run depcruise

      - name: Test and build
        run: npm run test -- --no-file-parallelism

      - name: Package smoke
        run: npm run package:smoke

  windows-compatibility:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check Windows package resolution and headless availability
        run: npx vitest run test/integration/packaged-child-resolution.test.ts test/unit/process-launchers.test.ts -t "loads child and native UI|reports headless availability"
