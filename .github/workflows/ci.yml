name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dependency boundaries
        run: npm run depcruise

      - name: Test and build
        run: npm run test -- --no-file-parallelism

      - name: Package smoke
        run: npm run package:smoke

  windows-compatibility:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check Windows package resolution and headless availability
        run: npx vitest run test/integration/packaged-child-resolution.test.ts test/unit/process-launchers.test.ts -t "loads child and native UI|reports headless availability"

  windows-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Assert PowerShell 7 named-pipe capability
        run: pwsh -NoLogo -NoProfile -NonInteractive -Command '$ErrorActionPreference="Stop"; if ($PSVersionTable.PSVersion.Major -lt 7 -or [Enum]::GetNames([IO.Pipes.PipeOptions]) -notcontains "CurrentUserOnly") { throw "PowerShell 7+ with PipeOptions.CurrentUserOnly is required" }; [Console]::Out.WriteLine("PI_TEAMS_PIPE_RUNTIME_OK")'

      - name: Native Windows runtime and peer security integration
        run: npx vitest run test/integration/windows-native.test.ts test/unit/windows-peer-acl.test.ts test/unit/windows-peer-pipe.test.ts test/unit/peer-host.test.ts test/integration/peer-transport.test.ts test/integration/peer-runtime.test.ts --no-file-parallelism

      - name: Upload Windows fixture artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-fixtures
          path: |
            ${{ runner.temp }}/teams-windows-native-*/**
            ${{ runner.temp }}/teams-windows-dispose-*/**
          if-no-files-found: ignore
          retention-days: 7
