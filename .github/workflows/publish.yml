name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - alpha
          - beta

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Set the NPM_TOKEN repository secret to an npm token with publish access to @quandev104/pi-teams."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dependency boundaries
        run: npm run depcruise

      - name: Test and build
        run: npm run test -- --no-file-parallelism

      - name: Package smoke
        run: npm run package:smoke

      - name: Bump version and update changelog
        id: bump
        env:
          VERSION_BUMP: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$VERSION_BUMP" in
            alpha|beta)
              npm version prerelease --preid="$VERSION_BUMP" --no-git-tag-version
              NPM_TAG="$VERSION_BUMP"
              ;;
            patch|minor|major)
              npm version "$VERSION_BUMP" --no-git-tag-version
              NPM_TAG=latest
              ;;
            *)
              echo "::error::Unsupported version bump."
              exit 1
              ;;
          esac
          VERSION=$(node -p 'require("./package.json").version')
          printf 'version=%s\nnpm_tag=%s\n' "$VERSION" "$NPM_TAG" >> "$GITHUB_OUTPUT"
          ./node_modules/.bin/git-cliff --output CHANGELOG.md --tag "v$VERSION"

      - name: Build and check release package
        run: |
          npm run build
          npm run package:smoke

      - name: Commit and push release version
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION:refs/tags/v$VERSION"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.bump.outputs.npm_tag }}
        run: npm publish --access public --tag "$NPM_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: v${{ steps.bump.outputs.version }}
          prerelease: ${{ inputs.version == 'alpha' || inputs.version == 'beta' }}
          generate_release_notes: true
          body: |
            ## @quandev104/pi-teams@${{ steps.bump.outputs.version }}

            ### Install

            ```bash
            pi install npm:@quandev104/pi-teams@${{ steps.bump.outputs.version }}
            ```

            > Latest: `pi install npm:@quandev104/pi-teams`
            > Beta: `pi install npm:@quandev104/pi-teams@beta`
            > Alpha: `pi install npm:@quandev104/pi-teams@alpha`
